name: Playwright Tests
on:
  push:
    branches: [ main, master, automation-nuls ]
  pull_request:
    branches: [ main, master, automation-nuls ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Verify SagradaGo is reachable
      id: health
      env:
        SAGRADA_WEB_URL: ${{ secrets.SAGRADA_WEB_URL }}
      run: |
        URL="${SAGRADA_WEB_URL:-https://www.sagradago.com}"
        HTML=$(curl -fsSL --max-time 30 "$URL" || true)
        if echo "$HTML" | grep -qi "Sagrada"; then
          echo "app=up" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Could not reach SagradaGo at $URL"
          exit 1
        fi
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        SAGRADA_WEB_URL: https://www.sagradago.com
        SAGRADA_EMAIL_ADDRESS: ${{ secrets.SAGRADA_EMAIL_ADDRESS }}
        SAGRADA_PASSWORD: ${{ secrets.SAGRADA_PASSWORD }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        PASSWORD: ${{ secrets.PASSWORD }}
        FIRST_NAME: ${{ secrets.FIRST_NAME }}
        MIDDLE_NAME: ${{ secrets.MIDDLE_NAME }}
        LAST_NAME: ${{ secrets.LAST_NAME }}
        CONTACT_NUMBER: ${{ secrets.CONTACT_NUMBER }}
        BIRTHDAY: ${{ secrets.BIRTHDAY }}
        SIGNUP_PASSWORD: ${{ secrets.SIGNUP_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore
